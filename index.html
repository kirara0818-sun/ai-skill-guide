<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>왕초보 AI 가이드 — 7개 카테고리</title>
<meta name="description" content="왕초보를 위한 AI 활용 가이드. 영상 만들기·SNS 키우기·디자인·글쓰기·자료 조사·공부·AI 팀 만들기까지, 지금 상황과 닮은 카드를 고르면 따라 하는 순서와 복사해서 쓰는 명령어가 한 번에 열립니다.">
<meta name="color-scheme" content="light">
<meta property="og:type" content="website">
<meta property="og:title" content="왕초보 AI 가이드 — 7개 카테고리">
<meta property="og:description" content="상황을 고르면 따라 하는 순서와 복사해서 쓰는 명령어가 한 번에 열립니다.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <header class="hero">
    <p class="eyebrow" id="eyebrow">왕초보 AI 강의 <span class="sep" aria-hidden="true"></span> 7개 카테고리 · 이 페이지 하나만 보면 됩니다</p>
    <h1 class="hero__title" id="hero-title">왕초보 AI 가이드</h1>
    <p class="hero__lead" id="hero-lead">지금 내 상황과 닮은 카드를 고르세요. 따라 하는 순서와 그대로 복사해서 쓰는 명령어가 한 번에 열립니다.</p>

    <div class="hero__tools">
      <div class="search">
        <svg class="search__icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <circle cx="8.6" cy="8.6" r="5.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M13 13l4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <input id="search" class="search__input" type="search" autocomplete="off" spellcheck="false"
               placeholder="무엇을 하고 싶으세요? (예: 자막, 카드뉴스, 블로그)" aria-label="항목 검색">
        <button id="search-clear" class="search__clear" type="button" aria-label="검색어 지우기" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M6 6l8 8M14 6l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button id="share-cat" class="sharebtn" type="button" title="지금 보고 있는 카테고리만 보이는 링크를 복사합니다">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.7 0l2.2-2.2a2.6 2.6 0 0 0-3.7-3.7l-1 1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M9.4 6.6a2.6 2.6 0 0 0-3.7 0L3.5 8.8a2.6 2.6 0 0 0 3.7 3.7l1-1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span>현재 카테고리 링크 복사</span>
      </button>
    </div>

    <nav class="tabs" id="tabs" aria-label="카테고리"></nav>

    <nav class="chips" id="chips" aria-label="상황별 필터" hidden></nav>
  </header>

  <section class="howto" id="howto" aria-label="이 페이지 쓰는 법">
    <div class="howto__item"><span class="howto__num">1</span><p>내 상황과 닮은 <strong>카드를 고릅니다</strong></p></div>
    <div class="howto__item"><span class="howto__num">2</span><p><strong>1·2·3 순서</strong>대로 따라 합니다</p></div>
    <div class="howto__item"><span class="howto__num">3</span><p>명령어를 <strong>복사해</strong> [ ] 안만 바꿉니다</p></div>
  </section>

  <section class="guide" id="guide" hidden></section>

  <p class="resultline" id="resultline" aria-live="polite"></p>

  <main>
    <section class="grid" id="grid" aria-label="항목 목록"></section>

    <div class="empty" id="empty" hidden>
      <p class="empty__title">찾는 항목이 없어요</p>
      <p class="empty__desc">검색어를 짧게 바꾸거나 <button type="button" class="linkish" id="empty-reset">전체 보기</button>를 눌러 보세요.</p>
    </div>
  </main>

  <footer class="foot">
    <p class="foot__tip" id="foot-tip">시간이 없으면 <strong>영상 만들기의 얼굴 고정</strong>과 <strong>자동 편집</strong>만 해 봐도 충분합니다. 결과가 마음에 안 들면 <strong>한 가지만 다시</strong> 부탁해 보세요.</p>
  </footer>
</div>

<!-- 카드 상세 -->
<div class="modal" id="modal" hidden>
  <div class="modal__overlay" data-close="1"></div>
  <div class="modal__panel" id="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
    <div class="modal__head">
      <div class="modal__headrow">
        <span class="tag" id="modal-tag"></span>
        <button class="modal__close" id="modal-close" type="button" aria-label="닫기">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M6 6l8 8M14 6l-8 8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
      </div>
      <h2 class="modal__title" id="modal-title"></h2>
      <p class="modal__situation" id="modal-situation"></p>
    </div>
    <div class="modal__body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
